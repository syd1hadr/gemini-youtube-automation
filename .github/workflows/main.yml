- name: Restore YouTube credentials
        shell: bash
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          CREDENTIALS_B64: ${{ secrets.CREDENTIALS_B64 }}
        run: |
          set -euo pipefail

          test -n "$CLIENT_SECRET_B64" || {
            echo "CLIENT_SECRET_B64 is missing"
            exit 1
          }

          test -n "$CREDENTIALS_B64" || {
            echo "CREDENTIALS_B64 is missing"
            exit 1
          }

          printf '%s' "$CLIENT_SECRET_B64" | base64 --decode > client_secrets.json
          printf '%s' "$CREDENTIALS_B64" | base64 --decode > credentials.json

          python -m json.tool client_secrets.json > /dev/null
          python -m json.tool credentials.json > /dev/null
