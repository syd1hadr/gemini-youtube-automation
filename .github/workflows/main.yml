name: Autonomous AI Course Generator

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          pip install -r requirements.txt

      - name: Restore API credentials
        run: |
          echo '${{ secrets.CLIENT_SECRET_B64 }}' > client_secrets.json
          echo '${{ secrets.CREDENTIALS_B64 }}' > credentials.json

      - name: Run Autonomous Production Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Upload Final Video for Debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-debug-files
          path: output/*.mp4
