name: Autonomous AI Course Generator

on:
  schedule:
    - cron: '0 7 * * *' # 12:30 PM IST daily
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and patch ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          pip install -r requirements.txt

      - name: Restore API credentials
        run: |
          echo '${{ secrets.CLIENT_SECRET_B64 }}' > client_secrets.json
          echo '${{ secrets.CREDENTIALS_B64 }}' > credentials.json

      - name: Run Autonomous Production Pipeline
        id: production-run
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Upload Audio Artifact for Debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-debug-files
          path: output/*.wav

      - name: Upload Final Video for Debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-debug-files
          path: output/*.mp4

      - name: Generate demo GIF from latest video
        if: always()
        run: |
          mkdir -p output
          ffmpeg -i output/*.mp4 -vf "fps=10,scale=320:-1" output/demo.gif || true

      - name: Commit and push content plan and demo GIF
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_plan.json output/demo.gif || true
          git commit -m "feat: Update content plan and demo GIF after daily video production" || echo "No changes to commit"
          git push
